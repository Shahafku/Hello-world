<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Split App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Budget Split</h1>
            <p class="subtitle">Split expenses easily with friends</p>
        </header>

        <main>
            <!-- Participants Section -->
            <section class="card" id="participants-section">
                <h2>Participants</h2>
                <div class="input-group">
                    <input type="text" id="participant-name" placeholder="Enter name">
                    <button onclick="addParticipant()" class="btn btn-primary">Add</button>
                </div>
                <div id="participants-list" class="tags-container"></div>
            </section>

            <!-- Add Expense Section -->
            <section class="card" id="expense-section">
                <h2>Add Expense</h2>
                <form id="expense-form" onsubmit="addExpense(event)">
                    <div class="form-group">
                        <label for="expense-description">Description</label>
                        <input type="text" id="expense-description" placeholder="e.g., Dinner, Groceries" required>
                    </div>
                    <div class="form-group">
                        <label for="expense-amount">Amount</label>
                        <input type="number" id="expense-amount" placeholder="0.00" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="expense-payer">Paid by</label>
                        <select id="expense-payer" required>
                            <option value="">Select who paid</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Split between</label>
                        <div id="split-checkboxes" class="checkbox-group"></div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Add Expense</button>
                </form>
            </section>

            <!-- Expenses List Section -->
            <section class="card" id="expenses-list-section">
                <h2>Expenses</h2>
                <div id="expenses-list" class="expenses-list">
                    <p class="empty-state">No expenses added yet</p>
                </div>
                <div class="total-row" id="total-row" style="display: none;">
                    <span>Total:</span>
                    <span id="total-amount">$0.00</span>
                </div>
            </section>

            <!-- Balances Section -->
            <section class="card" id="balances-section">
                <h2>Balances</h2>
                <div id="balances-list" class="balances-list">
                    <p class="empty-state">Add participants and expenses to see balances</p>
                </div>
            </section>

            <!-- Settlement Section -->
            <section class="card" id="settlement-section">
                <h2>Settlement</h2>
                <div id="settlement-list" class="settlement-list">
                    <p class="empty-state">Add expenses to see who owes whom</p>
                </div>
            </section>
        </main>

        <footer>
            <button onclick="clearAll()" class="btn btn-danger">Clear All</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
